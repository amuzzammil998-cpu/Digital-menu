<!DOCTYPE html>
<html>
<head>
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>The Lazy Leaf</title>
<style>
body{font-family:Arial;margin:0;background:#f5f5f5}
header{background:#174d32;color:white;text-align:center;padding:25px}
h1{margin:0}
.menu{padding:15px}
.item{background:white;margin:12px 0;padding:15px;border-radius:12px}
button{background:#174d32;color:white;border:0;padding:10px 15px;border-radius:8px}
</style>
</head>
<body>

<header>
<h1>The Lazy Leaf</h1>
<p>Digital Menu</p>
</header>

<div class="menu">

<div class="item">
<h2>🍚 Rice</h2>
<p>₹45</p>
<button onclick="order('Rice - ₹45')">Order</button>
</div>

<div class="item">
<h2>☕ Cold Coffee</h2>
<p>₹45</p>
<button onclick="order('Cold Coffee - ₹45')">Order</button>
</div>

<div class="item">
<h2>🍵 Tea</h2>
<p>₹34</p>
<button onclick="order('Tea - ₹34')">Order</button>
</div>

<div class="item">
<h2>🍫 Hot Chocolate</h2>
<p>₹34</p>
<button onclick="order('Hot Chocolate - ₹34')">Order</button>
</div>

<div class="item">
<h2>🍗 Chicken Biryani</h2>
<p>₹45</p>
<button onclick="order('Chicken Biryani - ₹45')">Order</button>
</div>

</div>

<script>
function order(item){
let phone="918504950489";
let message="Hello The Lazy Leaf, I want to order: "+item;
window.open("https://wa.me/"+phone+"?text="+encodeURIComponent(message));
}
</script>

</body>
</html>
